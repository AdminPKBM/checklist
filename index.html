<!DOCTYPE html>
<html lang="id">
<head>
    <script src="path/ke/script-penting.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ceklist Dokumen Minimalis</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        /* --- Reset & Base Styles --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Poppins', sans-serif;
            line-height: 1.6;
            background-color: #f7f7f9; /* Warna latar yang lebih lembut */
            color: #333;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #1a237e; /* Warna header yang lebih profesional/gelap */
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .subtitle { /* Kelas baru untuk paragraf */
            text-align: center;
            margin-bottom: 2rem;
            color: #666;
            font-size: 0.95rem;
        }

        form {
            max-width: 700px; /* Lebar yang lebih ideal untuk form panjang */
            margin: 0 auto;
            padding: 2.5rem 1.5rem; /* Padding lebih besar untuk desktop */
            background-color: #ffffff;
            border-radius: 16px; /* Sudut lebih melengkung */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05); /* Shadow lebih lembut */
            border: 1px solid #e9e9f1;
        }

        fieldset {
            border: none;
            margin-bottom: 2.5rem; /* Jarak antar bagian lebih lega */
            padding-top: 1rem;
        }

        legend {
            font-size: 1.2rem;
            font-weight: 600;
            color: #1a237e;
            padding: 0 0.5rem 0.5rem 0;
            margin-bottom: 1.5rem;
            border-bottom: 3px solid #6c757d; /* Garis pemisah lebih minimalis */
            width: 100%;
        }

        /* --- Input Teks (NPSN & Nama) --- */
        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #444;
            font-size: 0.95rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.8rem 1rem;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            border: 1px solid #ddd; /* Border lebih terang */
            border-radius: 8px;
            background-color: #ffffff;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #007BFF;
            box-shadow: 0 0 0 4px rgba(0, 123, 255, 0.1);
        }

        /* === Checkbox List Styling (Lebih Minimalis dan Keterbacaan) === */
        .form-group-checkbox {
            display: flex;
            align-items: center; /* Rata tengah vertikal */
            margin-bottom: 0.5rem;
            padding: 1rem;
            background-color: #ffffff; /* Menggunakan putih polos */
            border-radius: 8px;
            border: 1px solid #eee; /* Border sangat tipis */
            transition: all 0.2s ease;
            cursor: pointer; /* Menandakan seluruh baris bisa diklik */
        }
        
        .form-group-checkbox:hover {
            background-color: #f0f8ff; /* Warna hover lembut */
            border-color: #007BFF;
        }

        .form-group-checkbox input[type="checkbox"] {
            /* Sembunyikan checkbox asli untuk diganti dengan kustom */
            opacity: 0; 
            position: absolute;
        }
        
        /* Label kustom untuk item checklist */
        .form-group-checkbox label {
            margin: 0;
            font-weight: 400; /* Font lebih tipis untuk isi */
            color: #333;
            flex-grow: 1; /* Memastikan label mengisi ruang */
            cursor: pointer;
            padding-left: 30px; /* Ruang untuk checkbox kustom */
            position: relative;
        }
        
        /* Checkbox Kustom (Simulasi) */
        .form-group-checkbox label::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            border: 2px solid #6c757d; /* Warna abu-abu */
            border-radius: 4px;
            background-color: #fff;
            transition: all 0.2s ease;
        }
        
        /* Ikon Centang Kustom */
        .form-group-checkbox label::after {
            content: '\f00c'; /* Font Awesome checkmark icon */
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%) scale(0); /* Awalnya tersembunyi */
            color: #fff;
            background-color: #007BFF;
            width: 20px;
            height: 20px;
            line-height: 20px;
            text-align: center;
            border-radius: 4px;
            transition: all 0.2s ease;
        }
        
        /* Kondisi Tercentang */
        .form-group-checkbox input[type="checkbox"]:checked + label::before {
            border-color: #007BFF;
            background-color: #007BFF;
            opacity: 0; /* Sembunyikan kotak setelah tercentang */
        }

        .form-group-checkbox input[type="checkbox"]:checked + label::after {
            transform: translateY(-50%) scale(1); /* Tampilkan centang */
            background-color: #007BFF;
        }
        
        /* Tambahkan style untuk item yang sudah dicheck (opsional) */
        .form-group-checkbox input[type="checkbox"]:checked + label {
            color: #6c757d; /* Teks agak pudar */
            text-decoration: none; /* Hilangkan garis coret */
            font-weight: 500;
        }
        /* === Akhir Styling Checkbox Kustom === */


        /* Tombol Submit */
        button[type="submit"] {
            width: 100%;
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
            background-color: #1a237e; /* Warna biru yang sama dengan header */
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1.5rem;
        }

        button[type="submit"]:hover {
            background-color: #0d47a1;
            box-shadow: 0 4px 15px rgba(26, 35, 126, 0.3);
        }

        button[type="submit"]:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Pesan sukses dan error (tetap sama) */
        #message {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 8px;
            display: none;
            font-weight: 500;
            text-align: center;
        }
        #message.success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        #message.error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        /* --- Responsif (Mobile-first adjustment) --- */
        @media (max-width: 768px) {
            body { padding: 10px; }
            form { padding: 1.5rem 1rem; }
            h1 { font-size: 1.5rem; }
            .subtitle { font-size: 0.85rem; margin-bottom: 1.5rem; }
            legend { font-size: 1.1rem; margin-bottom: 1rem; }
            .form-group-checkbox { padding: 0.75rem; font-size: 0.95rem; }
            
            /* Penyesuaian kustom checkbox untuk mobile */
            .form-group-checkbox label { padding-left: 28px; }
            .form-group-checkbox label::before, .form-group-checkbox label::after {
                width: 18px;
                height: 18px;
                line-height: 18px;
            }
        }
    </style>
</head>
<body>

    <h1><i class="fas fa-list-check"></i> Ceklis Dokumen</h1>
    <p class="subtitle">Pastikan semua dokumen di bawah ini tersedia. Tombol **Kirim Data** akan aktif setelah NPSN dan Nama Sekolah diisi.</p>
    
    <form id="checklistForm">
        
        <fieldset>
            <legend>Informasi Sekolah </legend>
            <div class="form-group">
                <label for="npsn">NPSN</label>
                <input type="text" id="npsn" name="npsn" class="validate-input" required placeholder="Masukkan NPSN...">
            </div>
            <div class="form-group">
                <label for="namaSekolah">Nama Sekolah</label>
                <input type="text" id="namaSekolah" name="namaSekolah" class="validate-input" required placeholder="Masukkan Nama Sekolah...">
            </div>
        </fieldset>

        <fieldset>
            <legend>1.1 Keterlaksanaan Proses Belajar Mengajar</legend>
            <div class="form-group-checkbox">
                <input type="checkbox" id="item_1_1_a" name="item_1_1_a" value="Ada" class="validate-input">
                <label for="item_1_1_a">Foto/Video Interaksi KBM (misal: diskusi kelompok, bimbingan).</label>
            </div>
            <div class="form-group-checkbox">
                <input type="checkbox" id="item_1_1_b" name="item_1_1_b" value="Ada" class="validate-input">
                <label for="item_1_1_b">Jurnal Guru/Catatan Harian Guru</label>
            </div>
        </fieldset>

        <fieldset>
            <legend>9.1 Dokumen KOSP</legend>
            <div class="form-group-checkbox">
                <input type="checkbox" id="item_9_1_a" name="item_9_1_a" value="Ada" class="validate-input">
                <label for="item_9_1_a">Dokumen KOSP (Sah)</label>
            </div>
        </fieldset>

        <fieldset>
            <legend>9.2 Evaluasi Kurikulum</legend>
            <div class="form-group-checkbox">
                <input type="checkbox" id="item_9_2_a" name="item_9_2_a" value="Ada" class="validate-input">
                <label for="item_9_2_a">Dokumen dan notulen Evaluasi Kurikulum</label>
            </div>
        </fieldset>
        
        <div id="message"></div>

        <button type="submit" id="submitBtn" disabled>Kirim Data</button>

    </form>

    <script>
        // Fungsi untuk mengaktifkan/menonaktifkan tombol submit
        function checkValidation() {
            const npsn = document.getElementById('npsn').value.trim();
            const namaSekolah = document.getElementById('namaSekolah').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            
            // Tombol hanya aktif jika NPSN dan Nama Sekolah sudah diisi
            if (npsn !== '' && namaSekolah !== '') {
                submitBtn.disabled = false;
            } else {
                submitBtn.disabled = true;
            }
        }

        // Tambahkan event listener untuk input teks
        document.getElementById('npsn').addEventListener('input', checkValidation);
        document.getElementById('namaSekolah').addEventListener('input', checkValidation);

        // Optional: Toggle checkbox saat mengklik seluruh area form-group-checkbox
        document.querySelectorAll('.form-group-checkbox').forEach(item => {
            item.addEventListener('click', function(e) {
                // Pastikan klik tidak terjadi pada input itu sendiri atau elemen anak yang ingin ditangani secara berbeda
                if (e.target.tagName.toLowerCase() !== 'input') {
                    const checkbox = this.querySelector('input[type="checkbox"]');
                    checkbox.checked = !checkbox.checked;
                    // Anda mungkin perlu memicu event change secara manual jika ada logika JS lain yang bergantung padanya
                    checkbox.dispatchEvent(new Event('change')); 
                }
            });
        });
        
        // Cek inisial saat halaman dimuat (jika formulir sudah memiliki nilai default)
        checkValidation();

        // Contoh penanganan submit form (Anda bisa mengganti ini dengan fungsi kirim data Anda)
        document.getElementById('checklistForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const messageDiv = document.getElementById('message');
            
            // Simulasikan proses pengiriman
            messageDiv.style.display = 'block';
            messageDiv.className = 'success';
            messageDiv.innerHTML = 'Data Berhasil Dikirim! Terima kasih.';

            // Reset form setelah 3 detik (opsional)
            setTimeout(() => {
                // this.reset();
                // messageDiv.style.display = 'none';
                // checkValidation();
            }, 3000);
        });
    </script>
</body>
</html>
